version: "0.1.0"

# Setu scheme catalogue.
#
# THIS FILE DECIDES WHO IS ELIGIBLE. The LLM never does.
#
# Every rule carries:
#   source_doc / source_page / source_quote  -> the citation shown in the "Why?" panel
#   remedy                                   -> how a failing rule gets fixed
#
# The `remedy` block is what makes the ladder possible. A rule without one is a
# dead end; a rule with one is a rung. When adding a scheme, write the remedy
# even if it feels obvious — the pathfinder can only offer what is written here.
#
# Rule operators: eq, ne, gt, gte, lt, lte, in, not_in, contains, not_contains, is_true, is_false
# A rule whose field is missing from the profile evaluates to None -> NEED_INFO.

schemes:
  - id: pm_svanidhi
    name: PM SVANidhi
    full_name: PM Street Vendor's AtmaNirbhar Nidhi
    category: credit
    priority: 1
    benefit_summary: >-
      Collateral-free working capital loan in three tranches — ₹15,000, then
      ₹25,000, then ₹50,000 — with 7% annual interest subsidy and up to ₹400/year
      cashback for digital transactions.
    benefit_amount_rupees: 15000
    benefit_detail:
      tranches:
        - amount: 15000
          repayment_months: 12
        - amount: 25000
          repayment_months: 18
          requires: timely repayment of tranche 1
        - amount: 50000
          repayment_months: 36
          requires: timely repayment of tranche 2
      interest_subsidy_percent: 7
      cashback_max_per_year: 400
      cashback_condition: digital transactions on wholesale purchases of at least ₹2,000
      collateral_required: false
    source_docs:
      - Scheme Guidelines.pdf
      - Loan Operations Guidelines.pdf

    rules:
      - id: svanidhi_is_street_vendor
        description: Applicant must be a street vendor
        field: occupation_category
        op: eq
        value: street_vendor
        gating: true
        source_doc: Scheme Guidelines.pdf
        source_page: 11
        source_quote: >-
          A 'Street Vendor' means a person engaged in vending of articles, goods,
          wares, food items or merchandise of everyday use.
        remedy: null   # cannot be remedied — this is who the scheme is for

      - id: svanidhi_vending_proof
        description: Must hold a Certificate of Vending, ULB ID card, or Letter of Recommendation
        field: documents
        op: contains_any
        value: [vending_certificate, ulb_id_card, letter_of_recommendation]
        source_doc: Scheme Guidelines.pdf
        source_page: 3
        source_quote: >-
          In statutory towns, the Certificate of Vending (CoV)/Identity Card/Letter
          of Recommendation is the basis for identifying eligible vendors.
        # ── THE LADDER RUNG. This is the rule most vendors fail, and the one
        #    with a real, cheap, fast fix. It is the centrepiece of the demo.
        remedy:
          action: Get a Letter of Recommendation (LoR) from your Town Vending Committee or ULB
          cost_rupees: 0
          time_days: 7
          where: Urban Local Body office, or the Block Development Officer for peri-urban areas
          detail: >-
            Category C covers vendors left out of the ULB survey or who started
            vending after it was completed. They can apply for a Letter of
            Recommendation, which the scheme accepts in place of a Certificate of
            Vending. Once the BDO issues the LoR, the application is forwarded to
            the bank automatically.
          source_page: 18
          source_quote: >-
            Category C: SVs left out of the ULB-led identification survey or who
            have started vending after completion of the survey.

      - id: svanidhi_bank_account
        description: Must have a savings bank account for loan disbursal
        field: documents
        op: contains
        value: bank_account
        source_doc: Loan Operations Guidelines.pdf
        source_page: 3
        source_quote: >-
          Savings Bank Account Passbook/ Bank Statement with account details of
          the SV.
        remedy:
          action: Open a zero-balance Jan Dhan savings account
          cost_rupees: 0
          time_days: 2
          where: Any bank branch or Bank Mitra / business correspondent
          detail: >-
            A PMJDY account needs only Aadhaar and has no minimum balance
            requirement. The same account also satisfies PMSBY, so this one step
            clears two schemes.

      - id: svanidhi_aadhaar
        description: Must have an Aadhaar card
        field: documents
        op: contains
        value: aadhaar
        source_doc: Loan Operations Guidelines.pdf
        source_page: 3
        source_quote: >-
          Documents required: iii. Aadhaar Card iv. Voter Identity Card (for SVs
          from Assam and Meghalaya only) who do not have Aadhaar Card.
        remedy:
          action: Enrol for Aadhaar at a nearby enrolment centre
          cost_rupees: 0
          time_days: 30
          where: Aadhaar Seva Kendra or a bank/post-office enrolment centre
          detail: >-
            First-time enrolment is free; allow up to 30 days. Vendors in Assam
            and Meghalaya may use a Voter Identity Card instead.

      # Easy to miss when skimming, and genuinely required. Also the cheapest
      # rung on the whole ladder, and it feeds the ₹400/year digital-transaction
      # cashback the scheme pays.
      - id: svanidhi_upi_id
        description: Must have a UPI ID linked to the bank account
        field: documents
        op: contains
        value: upi_id
        source_doc: Loan Operations Guidelines.pdf
        source_page: 3
        source_quote: >-
          vi. Valid and Unique UPI ID linked to the SVs bank account.
        remedy:
          action: Create a UPI ID on any payments app linked to your bank account
          cost_rupees: 0
          time_days: 1
          where: Any UPI app — BHIM, PhonePe, Google Pay, Paytm
          detail: >-
            Free and takes minutes once the bank account exists. Digital
            transactions through it also earn up to ₹400/year cashback under the
            scheme.

      # Kept because the citation is real, but note this never fires: nothing in
      # a spoken profile can establish NPA status, so it evaluates unknown and is
      # marked optional. Honest position for a demo — a lender checks this, we
      # do not, and we should say so rather than pretend otherwise.
      - id: svanidhi_no_npa
        description: Must not have an existing loan classified as NPA or written off
        field: has_existing_loan_npa
        op: is_false
        value: true
        source_doc: Loan Operations Guidelines.pdf
        source_page: 6
        source_quote: >-
          LIs may decline applications where the applicant has an existing loan
          account classified as a Non-Performing Asset (NPA) or has been written
          off by any LI.
        optional: true
        checked_by: lender   # surfaced to the user as "your bank will verify this"
        remedy:
          action: Settle or regularise any defaulted loan with your lender
          cost_rupees: 0
          time_days: 90
          where: The bank holding the defaulted account
          detail: >-
            Simply having a current loan is fine — only accounts classified as
            NPA or written off are a problem.

  # ── PMSBY: accident cover. Matters more than it looks for a cart vendor —
  #    road-side work, long hours, no employer cover. Rounds Setu out from a
  #    credit tool into credit + insurance.
  #
  #    Sourced from the current PMSBY Guidelines. The superseded 2015 rules
  #    (Rs 12 premium) were removed from ingestion/sources so retrieval cannot
  #    surface the outdated figure.
  - id: pmsby
    name: PMSBY
    full_name: Pradhan Mantri Suraksha Bima Yojana
    category: insurance
    priority: 3
    benefit_summary: >-
      Rs 2 lakh cover for accidental death or disability, for a premium of
      Rs 20 per year auto-debited from your bank or post office account.
      Renewable yearly.
    benefit_amount_rupees: 200000
    benefit_detail:
      premium_per_year_rupees: 20
      cover_accidental_death_rupees: 200000
      cover_partial_disability_rupees: 100000
      renewal: annual, consent due by 31st May each year
      payment: auto-debit from the linked bank or post office account
    source_docs:
      - PMSBY Guidelines.pdf
      - SOP PMSBY.pdf

    rules:
      - id: pmsby_min_age
        description: Must be at least 18 years old
        field: age
        op: gte
        value: 18
        source_doc: PMSBY Guidelines.pdf
        source_page: 2
        source_quote: >-
          Individual bank/Post office account holders of participating banks/
          Post office aged between 18 years (completed) and 70 years (age nearer
          birthday) who give their consent to join / enable auto-debit will be
          enrolled into the scheme.
        remedy: null   # age is not remediable by any action

      - id: pmsby_max_age
        description: Must be 70 or younger
        field: age
        op: lte
        value: 70
        source_doc: PMSBY Guidelines.pdf
        source_page: 2
        source_quote: >-
          All individual bank/Post office account holders in the age group of
          18 to 70 years in participating banks / Post office will be entitled
          to join.
        remedy: null

      - id: pmsby_savings_account
        description: Must hold a bank or post office account for auto-debit of the premium
        field: documents
        op: contains
        value: bank_account
        source_doc: PMSBY Guidelines.pdf
        source_page: 2
        source_quote: >-
          Premium: Rs. 20/- per annum per member. The premium will be deducted
          from the account holder's bank / Post office account through 'auto
          debit' facility in one instalment on or before 1st June of each
          annual coverage period.
        remedy:
          action: Open a zero-balance Jan Dhan savings account
          cost_rupees: 0
          time_days: 2
          where: Any bank branch, post office, or Bank Mitra
          detail: >-
            A PMJDY account needs only Aadhaar and has no minimum balance. The
            same account also unlocks PM SVANidhi disbursal, so this one step
            clears two schemes. A post office savings account also qualifies.

  # ── FSSAI: the second rung for a food vendor. The Regulations define a petty
  #    food manufacturer as "a petty retailer, hawker, itinerant vendor or
  #    temporary stall holder" — the statute describes our user exactly.
  - id: fssai_basic
    name: FSSAI Basic Registration
    full_name: Food Safety and Standards Basic Registration (Petty Food Business Operator)
    category: licence
    priority: 2
    benefit_summary: >-
      Legal registration to sell food. Required for street food vendors, and the
      registration certificate and photo identity card must be displayed on the
      cart at all times.
    benefit_detail:
      turnover_limit_rupees: 1200000
      application_form: Form A (Schedule 2)
      issues: registration certificate + photo identity card
    source_docs:
      - FSSAI_Licensing_Registration_Regulations_2011.pdf
    rules:
      - id: fssai_sells_food
        description: Applicant must sell or manufacture food
        field: sells_food
        op: is_true
        value: true
        gating: true
        source_doc: FSSAI_Licensing_Registration_Regulations_2011.pdf
        source_page: 1
        source_quote: >-
          "Petty Food Manufacturer" means any food manufacturer, who manufactures
          or sells any article of food himself or a petty retailer, hawker,
          itinerant vendor or temporary stall holder.
        remedy: null   # not remediable — this is who the registration is for

      - id: fssai_turnover_under_limit
        description: Annual turnover must be under ₹12 lakh to qualify for Basic Registration
        field: annual_turnover
        op: lt
        value: 1200000
        source_doc: FSSAI_Licensing_Registration_Regulations_2011.pdf
        source_page: 2
        source_quote: >-
          ...tiny food businesses with an annual turnover not exceeding Rs 12
          lakhs and/or whose production capacity of food does not exceed 100
          kg/ltr per day.
        # Not a ladder rung: a State Licence is a different registration, so
        # "get one" never makes you eligible for Basic Registration. Recording
        # it as a remedy made verify_ladder fail, correctly.
        remedy: null
        see_also: >-
          Above the petty food business threshold a full FSSAI State Licence is
          required instead. Apply at foscos.fssai.gov.in (approx Rs 2,000, 30 days).

      - id: fssai_not_already_registered
        description: Must not already hold FSSAI registration
        field: documents
        op: not_contains
        value: fssai
        source_doc: FSSAI_Licensing_Registration_Regulations_2011.pdf
        source_page: 2
        source_quote: >-
          The Registering Authority shall issue a registration certificate and a
          photo identity card, which shall be displayed at a prominent place at
          all times within the premises or vehicle or cart or any other place
          where the person carries on sale/manufacture of food in case of Petty
          Food Business.
        remedy: null   # already holding it is a pass, not a gap
