<!doctype html>
<meta charset="utf-8">
<title>Setu — IVR (feature phone simulator)</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* System fonts only, no CDN, nothing fetched: this page must render with
     the wifi off, because that is how we intend to demo it. */
  :root {
    --bg: #10131a; --panel: #171b24; --line: #262c38;
    --ink: #e8ecf3; --muted: #8b95a7; --accent: #1a7f37; --accent-dim: #14602a;
    --red: #b5423a; --amber: #b58900;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: grid; grid-template-columns: 360px 1fr; gap: 28px;
    padding: 28px; min-height: 100vh;
  }
  @media (max-width: 860px) { body { grid-template-columns: 1fr; } }

  h1 { font-size: 17px; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }

  /* ── the handset ── */
  .phone {
    background: #0a0c11; border: 1px solid var(--line); border-radius: 22px;
    padding: 18px; box-shadow: 0 18px 50px rgba(0,0,0,.5);
  }
  .screen {
    background: #0e1620; border: 1px solid #1d2836; border-radius: 12px;
    padding: 14px; min-height: 190px; margin-bottom: 16px;
    display: flex; flex-direction: column;
  }
  .status {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); display: flex; justify-content: space-between;
    border-bottom: 1px solid #1d2836; padding-bottom: 8px; margin-bottom: 10px;
  }
  .dot { color: var(--red); }
  .dot.live { color: var(--accent); }
  .caption { font-size: 15px; line-height: 1.6; flex: 1; white-space: pre-wrap; }
  .caption.idle { color: var(--muted); font-style: italic; }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }

  /* ── keypad ── */
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .key {
    background: #1b2130; border: 1px solid #2a3242; color: var(--ink);
    border-radius: 10px; padding: 13px 4px; font-size: 19px; cursor: pointer;
    font-family: inherit; transition: transform .06s, background .12s;
  }
  .key small { display: block; font-size: 10px; color: var(--muted); margin-top: 3px; }
  .key:hover:not(:disabled) { background: #232b3b; }
  .key:active:not(:disabled) { transform: scale(.95); }
  .key:disabled { opacity: .28; cursor: default; }
  .key.armed { border-color: var(--accent); background: #17301f; }

  .actions { display: flex; gap: 8px; margin-top: 14px; }
  button.big {
    flex: 1; padding: 13px; border-radius: 10px; font-size: 14px; font-weight: 600;
    border: none; cursor: pointer; font-family: inherit; color: #fff;
  }
  .call { background: var(--accent); }
  .call:disabled { background: #24402d; color: #6d8377; cursor: default; }
  .hang { background: var(--red); }
  .hang:disabled { background: #3a2523; color: #8a6a67; cursor: default; }
  .mic { background: #24406b; }
  .mic.recording { background: var(--red); animation: pulse 1.1s infinite; }
  .mic:disabled { background: #1c2839; color: #66748c; cursor: default; }
  @keyframes pulse { 50% { opacity: .55; } }

  /* ── right column ── */
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; padding: 16px; margin-bottom: 16px;
  }
  .panel h2 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .09em;
    color: var(--muted); margin: 0 0 12px; font-weight: 600;
  }
  .persona {
    display: block; width: 100%; text-align: left; margin-bottom: 7px;
    background: #1b2130; border: 1px solid #2a3242; color: var(--ink);
    border-radius: 9px; padding: 10px 12px; cursor: pointer;
    font-family: inherit; font-size: 13px; line-height: 1.45;
  }
  .persona:hover:not(:disabled) { border-color: #3d4759; }
  .persona:disabled { opacity: .35; cursor: default; }
  .persona b { color: var(--muted); font-weight: 600; font-size: 11px;
               display: block; text-transform: uppercase; letter-spacing: .06em; }

  .log { font-size: 13px; max-height: 300px; overflow-y: auto; }
  .line { padding: 7px 0; border-bottom: 1px solid #212734; }
  .line:last-child { border-bottom: none; }
  .who { font-size: 10px; text-transform: uppercase; letter-spacing: .07em;
         color: var(--muted); }
  .line.setu .who { color: var(--accent); }

  .rung { border-left: 3px solid var(--accent); padding: 3px 0 3px 11px; margin: 7px 0; }
  .cost { color: var(--muted); font-size: 12px; }
  .empty { color: var(--muted); font-size: 13px; font-style: italic; }
</style>

<div>
  <h1>Setu — IVR simulator</h1>
  <div class="sub">A feature phone. No app, no screen, no reading.</div>

  <div class="phone">
    <div class="screen">
      <div class="status">
        <span id="state">idle</span>
        <span class="dot" id="dot">●</span>
      </div>
      <div class="caption idle" id="caption">Press Call to dial Setu.</div>
      <div class="hint" id="hint"></div>
    </div>

    <div class="keypad" id="keypad"></div>

    <div class="actions">
      <button class="big call" id="btnCall">📞 Call</button>
      <button class="big hang" id="btnHang" disabled>Hang up</button>
    </div>
    <div class="actions">
      <button class="big mic" id="btnMic" disabled>🎙 Hold to speak</button>
    </div>
  </div>
</div>

<div>
  <div class="panel">
    <h2>Canned callers — demo insurance if the mic fails</h2>
    <div id="personas"></div>
  </div>

  <div class="panel">
    <h2>What Setu decided</h2>
    <div id="decisions"><span class="empty">Nothing yet.</span></div>
  </div>

  <div class="panel">
    <h2>Call transcript</h2>
    <div class="log" id="log"><span class="empty">No call in progress.</span></div>
  </div>
</div>

<audio id="player"></audio>

<script>
const KEYS = [
  ['1',''],['2',''],['3',''],
  ['4',''],['5',''],['6',''],
  ['7',''],['8',''],['9','hang up'],
  ['*',''],['0','operator'],['#','done'],
];

const PERSONAS = [
  { tag: 'Street vendor · no vending card',
    text: 'मैं ठेले पर सब्ज़ी बेचता हूँ। मेरे पास वेंडिंग कार्ड नहीं है। मुझे दुकान बढ़ाने के लिए पैसे चाहिए।' },
  { tag: 'Food vendor · age 40',
    text: 'मैं सड़क किनारे समोसे बेचता हूँ, मेरी उम्र चालीस साल है, और मुझे लोन चाहिए।' },
  { tag: 'English · fruit cart',
    text: 'I sell fruit from a cart in Bengaluru. I have never taken a bank loan. I want to grow my business.' },
];

let callId = null, expect = null, recorder = null, chunks = [];

const $ = id => document.getElementById(id);
const player = $('player');

function renderKeypad() {
  $('keypad').innerHTML = KEYS.map(([d, label]) =>
    `<button class="key" data-d="${d}" disabled>${d}${label ? `<small>${label}</small>` : ''}</button>`
  ).join('');
  document.querySelectorAll('.key').forEach(k =>
    k.onclick = () => press(k.dataset.d));
}

function renderPersonas() {
  $('personas').innerHTML = PERSONAS.map((p, i) =>
    `<button class="persona" data-i="${i}" disabled><b>${p.tag}</b>${p.text}</button>`
  ).join('');
  document.querySelectorAll('.persona').forEach(b =>
    b.onclick = () => sayText(PERSONAS[b.dataset.i].text));
}

function log(who, text) {
  const el = $('log');
  if (el.querySelector('.empty')) el.innerHTML = '';
  el.insertAdjacentHTML('beforeend',
    `<div class="line ${who === 'Setu' ? 'setu' : ''}">
       <div class="who">${who}</div><div>${escapeHtml(text)}</div></div>`);
  el.scrollTop = el.scrollHeight;
}

const escapeHtml = s => String(s).replace(/[&<>"]/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

function setControls() {
  const live = !!callId;
  $('btnCall').disabled = live;
  $('btnHang').disabled = !live;
  $('dot').className = 'dot' + (live ? ' live' : '');
  $('btnMic').disabled = !(live && expect === 'speech');
  document.querySelectorAll('.persona').forEach(b =>
    b.disabled = !(live && expect === 'speech'));
  document.querySelectorAll('.key').forEach(k =>
    k.disabled = !(live && expect === 'digit'));
}

function applyTurn(turn) {
  expect = turn.expect;
  $('state').textContent = turn.state.replace(/_/g, ' ');
  $('caption').textContent = turn.say;
  $('caption').className = 'caption';
  log('Setu', turn.say);

  const opts = turn.options || [];
  $('hint').textContent = opts.length
    ? opts.map(o => `${o.digit} — ${o.label_en}`).join('   ·   ')
    : (turn.expect === 'speech' ? 'Hold the mic button, or pick a canned caller →' : '');

  // Light up only the keys this state actually accepts.
  document.querySelectorAll('.key').forEach(k => k.classList.remove('armed'));
  opts.forEach(o => {
    const k = document.querySelector(`.key[data-d="${o.digit}"]`);
    if (k) k.classList.add('armed');
  });

  if (turn.detail && turn.detail.decisions) renderDecisions(turn.detail.decisions);
  if (turn.audio_url) { player.src = turn.audio_url; player.play().catch(() => {}); }
  if (turn.expect === 'end') endCall(false);
  setControls();
}

function renderDecisions(decisions) {
  if (!decisions || !decisions.length) {
    $('decisions').innerHTML = '<span class="empty">No scheme matched.</span>';
    return;
  }
  $('decisions').innerHTML = decisions.map(d => {
    const rungs = (d.ladder || []).map(r =>
      `<div class="rung"><b>${r.order}. ${escapeHtml(r.action)}</b><br>
       <span class="cost">${r.cost_rupees === 0 ? 'free' : '₹' + r.cost_rupees} ·
       ${r.time_days} days${r.where ? ' · ' + escapeHtml(r.where) : ''}</span></div>`
    ).join('');
    return `<div style="margin-bottom:14px">
      <b>${escapeHtml(d.scheme_name || d.scheme_id)}</b>
      <span class="cost"> — ${escapeHtml(d.status || '')}</span>${rungs}</div>`;
  }).join('');
}

async function api(path, body, isForm) {
  const res = await fetch(path, {
    method: 'POST',
    ...(isForm ? { body } : { headers: { 'Content-Type': 'application/json' },
                              body: JSON.stringify(body) }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function startCall() {
  $('log').innerHTML = '';
  $('decisions').innerHTML = '<span class="empty">Nothing yet.</span>';
  const r = await api('/api/ivr/call', {});
  callId = r.call_id;
  setControls();
  applyTurn(r.turn);
}

function endCall(silent) {
  callId = null; expect = null;
  $('state').textContent = 'idle';
  if (!silent) { /* leave the last caption up so judges can read it */ }
  document.querySelectorAll('.key').forEach(k => k.classList.remove('armed'));
  setControls();
}

async function press(digit) {
  if (!callId) return;
  log('Caller', `pressed ${digit}`);
  const r = await api('/api/ivr/digit', { call_id: callId, digit });
  applyTurn(r.turn);
}

async function sayText(text) {
  if (!callId) return;
  log('Caller', text);
  $('caption').textContent = 'Checking the government rules…';
  const r = await api('/api/ivr/text', { call_id: callId, text });
  applyTurn(r.turn);
}

// ── microphone ───────────────────────────────────────────────────────────────
async function startRec() {
  if (!callId || expect !== 'speech') return;
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(t => t.stop());
    $('caption').textContent = 'Listening…';
    const fd = new FormData();
    fd.append('call_id', callId);
    fd.append('audio', new Blob(chunks, { type: 'audio/webm' }), 'clip.webm');
    try {
      const r = await api('/api/ivr/speech', fd, true);
      if (r.transcript) log('Caller', r.transcript);
      applyTurn(r.turn);
    } catch (e) {
      $('caption').textContent = 'Could not hear that — try a canned caller.';
    }
  };
  recorder.start();
  $('btnMic').classList.add('recording');
  $('btnMic').textContent = '● Recording — release to send';
}

function stopRec() {
  if (recorder && recorder.state === 'recording') recorder.stop();
  recorder = null;
  $('btnMic').classList.remove('recording');
  $('btnMic').textContent = '🎙 Hold to speak';
}

renderKeypad();
renderPersonas();
setControls();

$('btnCall').onclick = startCall;
$('btnHang').onclick = () => { log('Caller', 'hung up'); endCall(true); };
['mousedown', 'touchstart'].forEach(e => $('btnMic').addEventListener(e, startRec));
['mouseup', 'mouseleave', 'touchend'].forEach(e => $('btnMic').addEventListener(e, stopRec));

// A real caller uses a keypad, so let the judge use theirs.
document.addEventListener('keydown', e => {
  if (callId && expect === 'digit' && /^[0-9*#]$/.test(e.key)) press(e.key);
});
</script>
