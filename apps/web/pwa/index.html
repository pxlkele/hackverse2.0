<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<title>Setu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a7f37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /*
   * Designed for someone who cannot read the screen.
   *
   *  - one dominant control, always in the same place under the thumb
   *  - numerals (1 2 3) not words: recognised far more widely than script
   *  - icons carry the meaning, text only confirms it
   *  - nothing below 56px: this is used standing up, one-handed, outdoors
   *  - high contrast, because the other likely context is bright sunlight
   */
  :root {
    --bg: #0f1116; --card: #171b24; --line: #2a3242;
    --ink: #f2f5f9; --muted: #98a2b3;
    --green: #1a7f37; --green-lit: #22a04a; --red: #c0392b; --amber: #b58900;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overscroll-behavior: none;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand img { width: 30px; height: 30px; border-radius: 7px; }

  /* Eight languages will not fit across a cheap phone, so the row scrolls
     sideways rather than wrapping and pushing the talk button off screen. Each
     chip is labelled in its OWN script — someone who cannot read Devanagari can
     still find "ಕನ್ನಡ", and that recognition is the whole point. */
  .lang {
    display: flex; gap: 6px; overflow-x: auto; max-width: 62%;
    scrollbar-width: none; -ms-overflow-style: none;
    scroll-snap-type: x proximity;
  }
  .lang::-webkit-scrollbar { display: none; }
  .lang button {
    flex: none; min-width: 60px; min-height: 44px; padding: 0 12px;
    border-radius: 10px; font-size: 16px; scroll-snap-align: end;
    font-weight: 700; border: 2px solid var(--line); background: transparent;
    color: var(--muted); font-family: inherit; white-space: nowrap;
  }
  .lang button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  main { flex: 1; overflow-y: auto; padding: 18px 16px 28px; }

  /* ── the one control that matters ── */
  .talk-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 8px 0 22px; }
  .talk {
    width: 210px; height: 210px; border-radius: 50%; border: none;
    background: var(--green); color: #fff; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; box-shadow: 0 10px 34px rgba(26,127,55,.42); cursor: pointer;
  }
  .talk svg { width: 74px; height: 74px; fill: #fff; }
  .talk span { font-size: 19px; font-weight: 700; }
  .talk:disabled { background: #2b3441; box-shadow: none; color: var(--muted); }
  .talk:disabled svg { fill: var(--muted); }
  .talk.rec { background: var(--red); box-shadow: 0 10px 34px rgba(192,57,43,.45); animation: beat 1.15s infinite; }
  @keyframes beat { 50% { transform: scale(.955); } }

  .status { font-size: 19px; text-align: center; min-height: 52px; padding: 0 8px; }
  .status.thinking { color: var(--amber); }

  /* ── answer ── */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .answer { font-size: 18px; line-height: 1.65; }

  .replay {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 62px; margin-top: 14px; border-radius: 12px;
    background: var(--green); color: #fff; border: none; font-family: inherit;
    font-size: 18px; font-weight: 700;
  }
  .replay svg { width: 26px; height: 26px; fill: #fff; }

  .scheme-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .amount { color: var(--green-lit); font-weight: 700; font-size: 22px; }

  /* Steps are numbered, not bulleted: a numeral survives illiteracy. */
  .step { display: flex; gap: 13px; padding: 13px 0; border-top: 1px solid var(--line); }
  .num {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .step-body { flex: 1; }
  .step-action { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
  .meta b { color: var(--ink); font-weight: 700; }
  .free { color: var(--green-lit); font-weight: 700; }

  .human {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 66px; border-radius: 14px; margin-top: 6px;
    background: transparent; border: 2px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 18px; font-weight: 600;
  }
  .human svg { width: 27px; height: 27px; fill: var(--ink); }

  /* Stop and start-over. Deliberately full width and side by side directly
     under the talk button: the moment you need them is the moment the app is
     talking over you, and hunting for a small control while it does that is
     the whole problem. */
  .controls { display: flex; gap: 10px; margin: -8px 0 20px; }
  .ctrl {
    flex: 1; min-height: 58px; border-radius: 12px; font-family: inherit;
    font-size: 17px; font-weight: 700; background: transparent;
    border: 2px solid var(--line); color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .ctrl svg { width: 22px; height: 22px; fill: currentColor; }
  .ctrl.stop { border-color: var(--red); color: #ff9d92; }

  .offline {
    display: none; background: var(--amber); color: #241f00; text-align: center;
    padding: 9px; font-weight: 700; font-size: 15px;
  }
  body.offline .offline { display: block; }
  .hidden { display: none !important; }
</style>

<div class="offline" id="offlineBar">⚠️ इंटरनेट नहीं है · No internet</div>

<header>
  <div class="brand"><img src="icon-192.png" alt=""> Setu</div>
  <!-- Built from T at load: one list of languages, not two that drift apart. -->
  <div class="lang" id="langRow"></div>
</header>

<main>
  <div class="talk-wrap">
    <button class="talk" id="talk" data-say-hi="बोलने के लिए दबाइए" data-say-en="Press to speak">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 12a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 12z"/></svg>
      <span id="talkLabel">बोलिए</span>
    </button>
    <div class="status" id="status">अपने बारे में बताइए</div>
  </div>

  <div class="controls">
    <button class="ctrl stop" id="halt">
      <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      <span id="haltLabel">रोकिए</span>
    </button>
    <button class="ctrl" id="reset">
      <svg viewBox="0 0 24 24"><path d="M12 5V2L7 7l5 5V9a5 5 0 1 1-5 5H5a7 7 0 1 0 7-9z"/></svg>
      <span id="resetLabel">नई शुरुआत</span>
    </button>
  </div>

  <div id="answerCard" class="card hidden">
    <div class="answer" id="answerText"></div>
    <button class="replay" id="replay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="replayLabel">फिर से सुनिए</span>
    </button>
  </div>

  <div id="schemes"></div>

  <button class="human hidden" id="human">
    <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/></svg>
    <span id="humanLabel">किसी व्यक्ति से बात करें</span>
  </button>
</main>

<audio id="player" playsinline></audio>

<script>
const T = {
  hi: { label:'हिं', tag:'hi-IN',

        prompt:'तुमच्याबद्दल सांगा', talk:'बोला', stop:'थांबा', listening:'ऐकत आहोत…',
        thinking:'सरकारी नियम पाहत आहोत…', replay:'पुन्हा ऐका', human:'एखाद्या व्यक्तीशी बोला',
        err:'पुन्हा प्रयत्न करा', free:'मोफत', days:'दिवस', steps:'पायऱ्या',
        denied:'माइकची परवानगी द्या', insecure:'हे पेज सुरक्षित नाही', tooShort:'थोडं जास्त वेळ बोला', offline:'सर्व्हरशी संपर्क होत नाही', halt:'थांबवा', reset:'नवीन सुरुवात' },
  gu: { label:'ગુજરાતી', tag:'gu-IN',
        prompt:'તમારા વિશે કહો', talk:'બોલો', stop:'રોકો', listening:'સાંભળી રહ્યા છીએ…',
        thinking:'સરકારી નિયમો જોઈ રહ્યા છીએ…', replay:'ફરી સાંભળો', human:'કોઈ વ્યક્તિ સાથે વાત કરો',
        err:'ફરી પ્રયત્ન કરો', free:'મફત', days:'દિવસ', steps:'પગલાં',
        denied:'માઇકની પરવાનગી આપો', insecure:'આ પેજ સુરક્ષિત નથી', tooShort:'થોડું વધુ બોલો', offline:'સર્વર સાથે સંપર્ક થતો નથી', halt:'બંધ કરો', reset:'નવી શરૂઆત' },
  bn: { label:'বাংলা', tag:'bn-IN',
        prompt:'আপনার কথা বলুন', talk:'বলুন', stop:'থামুন', listening:'শুনছি…',
        thinking:'সরকারি নিয়ম দেখছি…', replay:'আবার শুনুন', human:'কারও সঙ্গে কথা বলুন',
        err:'আবার চেষ্টা করুন', free:'বিনামূল্যে', days:'দিন', steps:'ধাপ',
        denied:'মাইকের অনুমতি দিন', insecure:'এই পেজ সুরক্ষিত নয়', tooShort:'একটু বেশি সময় বলুন', offline:'সার্ভারে পৌঁছানো যাচ্ছে না', halt:'থামান', reset:'নতুন করে শুরু' },
  ta: { label:'தமிழ்', tag:'ta-IN',
        prompt:'உங்களைப் பற்றி சொல்லுங்கள்', talk:'பேசுங்கள்', stop:'நிற்க', listening:'கேட்கிறோம்…',
        thinking:'அரசு விதிகளைப் பார்க்கிறோம்…', replay:'மீண்டும் கேளுங்கள்', human:'ஒருவருடன் பேசுங்கள்',
        err:'மீண்டும் முயற்சிக்கவும்', free:'இலவசம்', days:'நாட்கள்', steps:'படிகள்',
        denied:'மைக் அனுமதி தாருங்கள்', insecure:'இந்தப் பக்கம் பாதுகாப்பானது அல்ல', tooShort:'இன்னும் கொஞ்சம் நேரம் பேசுங்கள்', offline:'சேவையகத்தை அணுக முடியவில்லை', halt:'நிறுத்து', reset:'மீண்டும் தொடங்கு' },
  te: { label:'తెలుగు', tag:'te-IN',
        prompt:'మీ గురించి చెప్పండి', talk:'మాట్లాడండి', stop:'ఆపండి', listening:'వింటున్నాము…',
        thinking:'ప్రభుత్వ నియమాలు చూస్తున్నాము…', replay:'మళ్ళీ వినండి', human:'ఒక వ్యక్తితో మాట్లాడండి',
        err:'మళ్ళీ ప్రయత్నించండి', free:'ఉచితం', days:'రోజులు', steps:'అడుగులు',
        denied:'మైక్ అనుమతి ఇవ్వండి', insecure:'ఈ పేజీ సురక్షితం కాదు', tooShort:'కొంచెం ఎక్కువ సమయం మాట్లాడండి', offline:'సర్వర్‌ను చేరుకోలేకపోతున్నాము', halt:'ఆపండి', reset:'కొత్తగా ప్రారంభించండి' },
  kn: { label:'ಕನ್ನಡ', tag:'kn-IN',
        prompt:'ನಿಮ್ಮ ಬಗ್ಗೆ ಹೇಳಿ', talk:'ಮಾತನಾಡಿ', stop:'ನಿಲ್ಲಿಸಿ', listening:'ಕೇಳುತ್ತಿದ್ದೇವೆ…',
        thinking:'ಸರ್ಕಾರಿ ನಿಯಮಗಳನ್ನು ನೋಡುತ್ತಿದ್ದೇವೆ…', replay:'ಮತ್ತೆ ಕೇಳಿ', human:'ಒಬ್ಬ ವ್ಯಕ್ತಿಯೊಂದಿಗೆ ಮಾತನಾಡಿ',
        err:'ಮತ್ತೆ ಪ್ರಯತ್ನಿಸಿ', free:'ಉಚಿತ', days:'ದಿನಗಳು', steps:'ಹಂತಗಳು',
        denied:'ಮೈಕ್ ಅನುಮತಿ ನೀಡಿ', insecure:'ಈ ಪುಟ ಸುರಕ್ಷಿತವಾಗಿಲ್ಲ', tooShort:'ಸ್ವಲ್ಪ ಹೆಚ್ಚು ಸಮಯ ಮಾತನಾಡಿ', offline:'ಸರ್ವರ್ ತಲುಪಲು ಆಗುತ್ತಿಲ್ಲ', halt:'ನಿಲ್ಲಿಸಿ', reset:'ಹೊಸದಾಗಿ ಪ್ರಾರಂಭಿಸಿ' },
};

/* Which backend to talk to.
 *
 * Empty means same-origin, which is the normal case: FastAPI serves this page
 * itself, so relative paths already reach it and nothing here has to know its
 * own URL. That is the path that has been demoed and it stays the default.
 *
 * It only needs setting when the console and the phone sit behind *different*
 * tunnels and the operator wants to watch cases arrive live. Tunnel URLs are
 * regenerated on every restart, so hard-coding one guarantees a dead build at
 * the worst moment - it comes from `?api=https://...` instead and is remembered,
 * because an installed PWA is launched from the home screen with no query
 * string. `?api=` on its own clears it and returns to same-origin.
 */
const API_BASE = (() => {
  const q = new URLSearchParams(location.search);
  if (q.has('api')) {
    const v = (q.get('api') || '').trim().replace(/\/+$/, '');
    try { v ? localStorage.setItem('setuApi', v) : localStorage.removeItem('setuApi'); } catch {}
    return v;
  }
  try { return localStorage.getItem('setuApi') || ''; } catch { return ''; }
})();

/* ngrok answers a browser-looking request with an HTML interstitial instead of
   the JSON it was asked for. That fails *successfully* - HTTP 200, unparseable
   body - so it reads as a broken app rather than a missing header. Harmless to
   send when the header means nothing, so it always goes. */
const API_HEADERS = API_BASE ? { 'ngrok-skip-browser-warning': 'true' } : {};
const apiUrl = path => API_BASE + path;

let lang = 'hi', callId = null, recorder = null, chunks = [], lastAudio = null, lastReason = null;
let lastSpoken = '';        // the answer's words, so we can speak it without the server's mp3
let audioUnlocked = false;
let inflight = null;        // AbortController for the request in flight, so Stop can cut it
const $ = id => document.getElementById(id);
const t = () => T[lang];

/* Controls announce themselves. Uses the device voice rather than our server
   TTS: these are fixed UI labels, they must work before any network call, and
   spending a round trip on "Speak" would make the button feel broken. */
function say(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = (t().tag) || 'hi-IN';
    u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { /* a missing voice must never block the tap */ }
}

/* One chip per language in T, labelled in its own script. Built here rather than
   written into the markup so that adding a language is a single edit to T — the
   PWA and the server's SUPPORTED_LANGUAGES were previously two hardcoded lists
   and the second one silently offered languages the first refused. */
function buildLangRow() {
  const row = $('langRow');
  row.innerHTML = '';
  for (const code of Object.keys(T)) {
    const b = document.createElement('button');
    b.textContent = T[code].label;
    b.dataset.code = code;
    b.setAttribute('aria-pressed', String(code === lang));
    b.setAttribute('aria-label', T[code].label);
    b.onclick = () => {
      lang = code;
      callId = null;                       // new language, new session
      applyLang();
      say(t().prompt);                     // the new language announces itself
    };
    row.appendChild(b);
  }
}

function applyLang() {
  for (const b of $('langRow').children) {
    b.setAttribute('aria-pressed', String(b.dataset.code === lang));
  }
  document.documentElement.lang = lang;
  $('talkLabel').textContent = t().talk;
  $('replayLabel').textContent = t().replay;
  $('humanLabel').textContent = t().human;
  $('haltLabel').textContent = t().halt;
  $('resetLabel').textContent = t().reset;
  if (!callId) $('status').textContent = t().prompt;
}

async function api(path, body, isForm) {
  const res = await fetch(apiUrl(path), {
    method: 'POST',
    signal: inflight ? inflight.signal : undefined,
    ...(isForm
      ? { headers: { ...API_HEADERS }, body }
      : { headers: { 'Content-Type':'application/json', ...API_HEADERS }, body: JSON.stringify(body) }),
  });
  if (!res.ok) throw new Error(await res.text());
  const data = await res.json();
  /* The server answers 200 with the reason in the body when ASR gives up, so a
     timeout, a busy decoder and real silence all used to read as "I did not hear
     anything" on screen. Keep the last one visible — on stage you need to know
     whether to speak again or wait. */
  lastReason = data.reason || (data.transcript === '' ? 'empty transcript' : null);
  return data;
}

async function ensureCall() {
  if (callId) return callId;
  const r = await api('/api/ivr/call', { language: lang });   // screen picks, so no spoken menu
  callId = r.call_id;
  return callId;
}

/* Android only lets an <audio> element start on its own once a tap has started
   it at least once. Our answer arrives 8-40 seconds after the tap, long after
   that permission has expired, so play() was rejected and the caller got the
   answer as text in silence. Starting the element on a blank clip inside the
   tap itself buys the permission early and keeps it for the session. */
const SILENCE = 'data:audio/wav;base64,UklGRmQAAABXQVZFZm10IBAAAAABAAEAQB8AAEAfAAABAAgAZGF0YUAAAACAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICAgICA';

function unlockAudio() {
  if (audioUnlocked) return;
  const p = $('player');
  p.src = SILENCE;
  const r = p.play();
  if (r) r.then(() => { audioUnlocked = true; }).catch(() => {});
}

/* Speak an answer. `url` is the server's mp3, `text` the same words.
   lastAudio is assigned on every single answer, including when there is no
   audio at all: leaving the previous turn's url in place is what made the
   replay button play "I could not hear you" over an answer that had arrived. */
/* Cross-origin only. An <audio> element cannot carry a header, so pointing src
   straight at a tunnel gets the interstitial HTML instead of the mp3 and the
   answer plays as silence. Fetching it ourselves is the only way to send the
   header, and the blob is kept per path so replay does not pay for it twice. */
const audioBlobs = new Map();

async function audioSrc(path) {
  if (!API_BASE) return path;                       // same-origin: the proven path, untouched
  if (audioBlobs.has(path)) return audioBlobs.get(path);
  const res = await fetch(apiUrl(path), { headers: { ...API_HEADERS } });
  if (!res.ok) throw new Error('audio ' + res.status);
  const blob = await res.blob();
  if (!blob.type.startsWith('audio/')) throw new Error('not audio: ' + blob.type);
  const objectUrl = URL.createObjectURL(blob);
  audioBlobs.set(path, objectUrl);
  return objectUrl;
}

async function playAnswer(url, text) {
  lastAudio = url || null;                 // the server path, so replay stays a cache hit
  if (text) lastSpoken = text;
  if (!url) { say(lastSpoken); return; }   // server TTS failed - the device voice still speaks
  const p = $('player');
  try {
    p.src = await audioSrc(url);
  } catch {
    say(lastSpoken);                       // unreachable or interstitial - speak it on the device
    return;
  }
  const r = p.play();
  if (r) r.catch(() => say(lastSpoken));   // still blocked - fall back rather than go silent
}

function render(turn) {
  const detail = turn.detail || {};
  $('answerText').textContent = turn.say || '';
  $('answerCard').classList.remove('hidden');
  $('human').classList.remove('hidden');
  playAnswer(turn.audio_url, turn.say);

  const decisions = detail.decisions || [];
  $('schemes').innerHTML = decisions.map(d => {
    const amount = d.benefit_amount_rupees
      ? `<div class="amount">₹${Number(d.benefit_amount_rupees).toLocaleString('en-IN')}</div>` : '';
    const rungs = (d.ladder || []).map(r => `
      <div class="step">
        <div class="num">${r.order}</div>
        <div class="step-body">
          <div class="step-action">${esc(r.action_local || r.action)}</div>
          <div class="meta">
            <span>${Number(r.cost_rupees) === 0
              ? `<b class="free">${t().free}</b>`
              : `<b>₹${Number(r.cost_rupees).toLocaleString('en-IN')}</b>`}</span>
            <span><b>${r.time_days}</b> ${t().days}</span>
            ${(r.where_local || r.where) ? `<span>📍 ${esc(r.where_local || r.where)}</span>` : ''}
          </div>
        </div>
      </div>`).join('');
    return `<div class="card">
      <div class="scheme-name">${esc(d.scheme_name_local || d.scheme_name || d.scheme_id)}</div>
      ${amount}${rungs}</div>`;
  }).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* The recording format is not ours to choose: Chrome gives webm/opus, iOS
   Safari gives mp4/aac whatever we ask for. The server names its temp file
   from the extension we send, so a hardcoded ".webm" hands Whisper a
   mislabelled container on an iPhone. Ask the recorder what it produced. */
const MIME_CANDIDATES = ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'];
const pickMime = () => (window.MediaRecorder && MediaRecorder.isTypeSupported)
  ? (MIME_CANDIDATES.find(m => MediaRecorder.isTypeSupported(m)) || '') : '';
const extFor = m => m.includes('mp4') ? 'mp4' : m.includes('ogg') ? 'ogg' : 'webm';

// A tap that never gets its second tap must still end by itself. Someone who
// gets distracted mid-sentence would otherwise record until the tab dies, and
// Whisper would then grind through minutes of cart noise on stage.
const MAX_MS = 45000;
let capTimer = null;

async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  const wanted = pickMime();
  recorder = new MediaRecorder(stream, wanted ? { mimeType: wanted } : {});

  // Captured now, not read in onstop: the tap handler nulls `recorder` the
  // moment it calls stop(), and the browser may ignore what we asked for.
  const outType = recorder.mimeType || wanted || 'audio/webm';

  chunks = [];
  recorder.ondataavailable = e => { if (e.data && e.data.size) chunks.push(e.data); };
  recorder.onstop = async () => {
    clearTimeout(capTimer);
    stream.getTracks().forEach(s => s.stop());
    $('talk').classList.remove('rec');
    $('talk').disabled = true;      // a second tap mid-pipeline would start a second call
    $('talkLabel').textContent = t().talk;
    $('status').textContent = t().thinking;
    $('status').classList.add('thinking');
    try {
      const fd = new FormData();
      fd.append('call_id', await ensureCall());
      const blob = new Blob(chunks, { type: outType });
      // A blob this small holds no speech. Saying so beats sending it and being
      // told "I did not hear anything" ten seconds later.
      if (blob.size < 2000) {
        $('status').textContent = t().tooShort;
        say(t().tooShort);
        return;
      }
      fd.append('audio', blob, 'clip.' + extFor(outType));
      inflight = new AbortController();
      const res = await api('/api/ivr/speech', fd, true);
      inflight = null;
      /* The server detects the spoken language and may have switched the call to
         it. Follow that here, so the labels and the answer are in one language
         instead of two — otherwise a Marathi answer sits under Hindi buttons. */
      if (res.language && res.language !== lang && T[res.language]) {
        lang = res.language;
        applyLang();
      }
      render(res.turn);
      // Kept small and in Latin: this is a diagnostic for us, not a message for
      // the caller, and it only appears when something actually went wrong.
      $('status').textContent = lastReason ? `(${lastReason})` : '';
    } catch (e) {
      // Stop aborts this fetch on purpose. Announcing "please try again" for
      // something the caller just asked for would be the app arguing back.
      if (e.name !== 'AbortError') {
        $('status').textContent = t().err;
        say(t().err);
      }
    } finally {
      inflight = null;
      $('status').classList.remove('thinking');
      $('talk').disabled = false;
    }
  };
  recorder.start();
  capTimer = setTimeout(() => {
    if (recorder && recorder.state === 'recording') { recorder.stop(); recorder = null; }
  }, MAX_MS);
  $('talk').classList.add('rec');
  $('talkLabel').textContent = t().stop;
  $('status').textContent = t().listening;
}

// Tap to start, tap to stop — hold-to-talk is fiddly on a cheap touchscreen and
// gives no second chance if the finger slips.
$('talk').onclick = async () => {
  unlockAudio();   // must happen inside the tap, before any await
  if (recorder && recorder.state === 'recording') { recorder.stop(); recorder = null; return; }
  say(t().talk);
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-mic-api');
    await ensureCall();
    await startRec();
  } catch (e) {
    /* Three failures look identical on screen but need different words. A
       blocked mic the caller can fix; a page served over plain http:// has no
       getUserMedia at all and only we can fix it — and silently showing
       "try again" for that would have us debugging the wrong thing on stage. */
    /* A dead tunnel looks exactly like a broken microphone from here: the tap
       calls ensureCall() before it ever touches the mic, that fetch fails, and
       the caller is told to try again by a button that will never work until
       the tunnel is restarted. Name it, so the next hour is not spent
       debugging the microphone. */
    const unreachable = e instanceof TypeError || e.name === 'TypeError';
    const insecure = !window.isSecureContext || e.message === 'no-mic-api';
    const denied = e.name === 'NotAllowedError' || e.name === 'SecurityError';
    $('status').textContent = insecure ? t().insecure
      : denied ? t().denied
      : unreachable ? (t().offline || t().err)
      : t().err;
    say($('status').textContent);
    recorder = null;
  }
};

$('replay').onclick = () => { unlockAudio(); playAnswer(lastAudio, lastSpoken); };

/* Everything that can be making noise or work, stopped at once. Four separate
   things can be running: the recorder, the request, the server's mp3 and the
   device voice, and stopping only some of them is what makes an app feel like
   it is ignoring you. */
function stopEverything() {
  if (inflight) { inflight.abort(); inflight = null; }
  clearTimeout(capTimer);
  if (recorder && recorder.state === 'recording') {
    try { recorder.stop(); } catch (e) { /* already stopped */ }
  }
  recorder = null;
  const p = $('player');
  try { p.pause(); p.currentTime = 0; } catch (e) { /* nothing loaded yet */ }
  if (window.speechSynthesis) speechSynthesis.cancel();
  $('talk').disabled = false;
  $('talk').classList.remove('rec');
  $('talkLabel').textContent = t().talk;
  $('status').classList.remove('thinking');
}

$('halt').onclick = () => {
  stopEverything();
  $('status').textContent = t().prompt;
};

/* Back to the opening screen without a reload — a reload on a quick tunnel is
   a gamble on the service worker and the network, and this has to work while
   someone is standing there waiting. A fresh call_id means the next question
   is a new conversation, not a follow-up to the last one. */
$('reset').onclick = () => {
  stopEverything();
  callId = null;
  lastAudio = null; lastSpoken = ''; lastReason = null;
  $('answerText').textContent = '';
  $('answerCard').classList.add('hidden');
  $('human').classList.add('hidden');
  $('schemes').innerHTML = '';
  $('status').textContent = t().prompt;
  window.scrollTo({ top: 0 });
  say(t().prompt);
};

$('human').onclick = async () => {
  say(t().human);
  if (!callId) return;
  const r = await api('/api/ivr/digit', { call_id: callId, digit: '0' });
  $('answerText').textContent = r.turn.say;
  playAnswer(r.turn.audio_url, r.turn.say);
};

const setOnline = () => document.body.classList.toggle('offline', !navigator.onLine);
addEventListener('online', setOnline);
addEventListener('offline', setOnline);
setOnline();
buildLangRow();
applyLang();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</html>
