<!doctype html>
<html lang="hi">
<meta charset="utf-8">
<title>Setu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a7f37">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
  /*
   * Designed for someone who cannot read the screen.
   *
   *  - one dominant control, always in the same place under the thumb
   *  - numerals (1 2 3) not words: recognised far more widely than script
   *  - icons carry the meaning, text only confirms it
   *  - nothing below 56px: this is used standing up, one-handed, outdoors
   *  - high contrast, because the other likely context is bright sunlight
   */
  :root {
    --bg: #0f1116; --card: #171b24; --line: #2a3242;
    --ink: #f2f5f9; --muted: #98a2b3;
    --green: #1a7f37; --green-lit: #22a04a; --red: #c0392b; --amber: #b58900;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
    overscroll-behavior: none;
  }

  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 16px; border-bottom: 1px solid var(--line); flex: none;
  }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 20px; }
  .brand img { width: 30px; height: 30px; border-radius: 7px; }

  .lang { display: flex; gap: 6px; }
  .lang button {
    min-width: 60px; min-height: 44px; border-radius: 10px; font-size: 16px;
    font-weight: 700; border: 2px solid var(--line); background: transparent;
    color: var(--muted); font-family: inherit;
  }
  .lang button[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: #fff; }

  main { flex: 1; overflow-y: auto; padding: 18px 16px 28px; }

  /* ── the one control that matters ── */
  .talk-wrap { display: flex; flex-direction: column; align-items: center; gap: 14px; margin: 8px 0 22px; }
  .talk {
    width: 210px; height: 210px; border-radius: 50%; border: none;
    background: var(--green); color: #fff; font-family: inherit;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; box-shadow: 0 10px 34px rgba(26,127,55,.42); cursor: pointer;
  }
  .talk svg { width: 74px; height: 74px; fill: #fff; }
  .talk span { font-size: 19px; font-weight: 700; }
  .talk:disabled { background: #2b3441; box-shadow: none; color: var(--muted); }
  .talk:disabled svg { fill: var(--muted); }
  .talk.rec { background: var(--red); box-shadow: 0 10px 34px rgba(192,57,43,.45); animation: beat 1.15s infinite; }
  @keyframes beat { 50% { transform: scale(.955); } }

  .status { font-size: 19px; text-align: center; min-height: 52px; padding: 0 8px; }
  .status.thinking { color: var(--amber); }

  /* ── answer ── */
  .card {
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 16px; margin-bottom: 14px;
  }
  .answer { font-size: 18px; line-height: 1.65; }

  .replay {
    display: flex; align-items: center; justify-content: center; gap: 10px;
    width: 100%; min-height: 62px; margin-top: 14px; border-radius: 12px;
    background: var(--green); color: #fff; border: none; font-family: inherit;
    font-size: 18px; font-weight: 700;
  }
  .replay svg { width: 26px; height: 26px; fill: #fff; }

  .scheme-name { font-size: 20px; font-weight: 700; margin-bottom: 4px; }
  .amount { color: var(--green-lit); font-weight: 700; font-size: 22px; }

  /* Steps are numbered, not bulleted: a numeral survives illiteracy. */
  .step { display: flex; gap: 13px; padding: 13px 0; border-top: 1px solid var(--line); }
  .num {
    flex: none; width: 42px; height: 42px; border-radius: 50%;
    background: var(--green); color: #fff; font-weight: 700; font-size: 20px;
    display: flex; align-items: center; justify-content: center;
  }
  .step-body { flex: 1; }
  .step-action { font-size: 17px; font-weight: 600; margin-bottom: 5px; }
  .meta { display: flex; gap: 14px; flex-wrap: wrap; color: var(--muted); font-size: 15px; }
  .meta b { color: var(--ink); font-weight: 700; }
  .free { color: var(--green-lit); font-weight: 700; }

  .human {
    display: flex; align-items: center; justify-content: center; gap: 12px;
    width: 100%; min-height: 66px; border-radius: 14px; margin-top: 6px;
    background: transparent; border: 2px solid var(--line); color: var(--ink);
    font-family: inherit; font-size: 18px; font-weight: 600;
  }
  .human svg { width: 27px; height: 27px; fill: var(--ink); }

  .offline {
    display: none; background: var(--amber); color: #241f00; text-align: center;
    padding: 9px; font-weight: 700; font-size: 15px;
  }
  body.offline .offline { display: block; }
  .hidden { display: none !important; }
</style>

<div class="offline" id="offlineBar">⚠️ इंटरनेट नहीं है · No internet</div>

<header>
  <div class="brand"><img src="icon-192.png" alt=""> Setu</div>
  <div class="lang">
    <button id="langHi" aria-pressed="true">हिं</button>
    <button id="langEn" aria-pressed="false">EN</button>
  </div>
</header>

<main>
  <div class="talk-wrap">
    <button class="talk" id="talk" data-say-hi="बोलने के लिए दबाइए" data-say-en="Press to speak">
      <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3z"/><path d="M19 12a1 1 0 1 0-2 0 5 5 0 0 1-10 0 1 1 0 1 0-2 0 7 7 0 0 0 6 6.92V21H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.08A7 7 0 0 0 19 12z"/></svg>
      <span id="talkLabel">बोलिए</span>
    </button>
    <div class="status" id="status">अपने बारे में बताइए</div>
  </div>

  <div id="answerCard" class="card hidden">
    <div class="answer" id="answerText"></div>
    <button class="replay" id="replay">
      <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
      <span id="replayLabel">फिर से सुनिए</span>
    </button>
  </div>

  <div id="schemes"></div>

  <button class="human hidden" id="human">
    <svg viewBox="0 0 24 24"><path d="M12 12a5 5 0 1 0 0-10 5 5 0 0 0 0 10zm0 2c-5 0-9 2.7-9 6v2h18v-2c0-3.3-4-6-9-6z"/></svg>
    <span id="humanLabel">किसी व्यक्ति से बात करें</span>
  </button>
</main>

<audio id="player" playsinline></audio>

<script>
const T = {
  hi: { prompt:'अपने बारे में बताइए', talk:'बोलिए', stop:'रोकिए', listening:'सुन रहे हैं…',
        thinking:'सरकारी नियम देख रहे हैं…', replay:'फिर से सुनिए', human:'किसी व्यक्ति से बात करें',
        err:'दोबारा कोशिश कीजिए', free:'मुफ़्त', days:'दिन', steps:'कदम' },
  en: { prompt:'Tell us about your work', talk:'Speak', stop:'Stop', listening:'Listening…',
        thinking:'Checking government rules…', replay:'Play again', human:'Talk to a person',
        err:'Please try again', free:'free', days:'days', steps:'steps' },
};

let lang = 'hi', callId = null, recorder = null, chunks = [], lastAudio = null;
const $ = id => document.getElementById(id);
const t = () => T[lang];

/* Controls announce themselves. Uses the device voice rather than our server
   TTS: these are fixed UI labels, they must work before any network call, and
   spending a round trip on "Speak" would make the button feel broken. */
function say(text) {
  try {
    if (!window.speechSynthesis) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'hi' ? 'hi-IN' : 'en-IN';
    u.rate = 0.92;
    speechSynthesis.speak(u);
  } catch (e) { /* a missing voice must never block the tap */ }
}

function applyLang() {
  $('langHi').setAttribute('aria-pressed', lang === 'hi');
  $('langEn').setAttribute('aria-pressed', lang === 'en');
  document.documentElement.lang = lang;
  $('talkLabel').textContent = t().talk;
  $('replayLabel').textContent = t().replay;
  $('humanLabel').textContent = t().human;
  if (!callId) $('status').textContent = t().prompt;
}

async function api(path, body, isForm) {
  const res = await fetch(path, {
    method: 'POST',
    ...(isForm ? { body } : { headers: {'Content-Type':'application/json'}, body: JSON.stringify(body) }),
  });
  if (!res.ok) throw new Error(await res.text());
  return res.json();
}

async function ensureCall() {
  if (callId) return callId;
  const r = await api('/api/ivr/call', { language: lang });   // screen picks, so no spoken menu
  callId = r.call_id;
  return callId;
}

function play(url) {
  if (!url) return;
  lastAudio = url;
  const p = $('player');
  p.src = url;
  p.play().catch(() => {});   // autoplay can be blocked; the replay button covers it
}

function render(turn) {
  const detail = turn.detail || {};
  $('answerText').textContent = turn.say || '';
  $('answerCard').classList.remove('hidden');
  $('human').classList.remove('hidden');
  play(turn.audio_url);

  const decisions = detail.decisions || [];
  $('schemes').innerHTML = decisions.map(d => {
    const amount = d.benefit_amount_rupees
      ? `<div class="amount">₹${Number(d.benefit_amount_rupees).toLocaleString('en-IN')}</div>` : '';
    const rungs = (d.ladder || []).map(r => `
      <div class="step">
        <div class="num">${r.order}</div>
        <div class="step-body">
          <div class="step-action">${esc(r.action)}</div>
          <div class="meta">
            <span>${Number(r.cost_rupees) === 0
              ? `<b class="free">${t().free}</b>`
              : `<b>₹${Number(r.cost_rupees).toLocaleString('en-IN')}</b>`}</span>
            <span><b>${r.time_days}</b> ${t().days}</span>
            ${r.where ? `<span>📍 ${esc(r.where)}</span>` : ''}
          </div>
        </div>
      </div>`).join('');
    return `<div class="card">
      <div class="scheme-name">${esc(d.scheme_name || d.scheme_id)}</div>
      ${amount}${rungs}</div>`;
  }).join('');
}

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function startRec() {
  const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
  recorder = new MediaRecorder(stream);
  chunks = [];
  recorder.ondataavailable = e => chunks.push(e.data);
  recorder.onstop = async () => {
    stream.getTracks().forEach(s => s.stop());
    $('talk').classList.remove('rec');
    $('talkLabel').textContent = t().talk;
    $('status').textContent = t().thinking;
    $('status').classList.add('thinking');
    try {
      const fd = new FormData();
      fd.append('call_id', await ensureCall());
      fd.append('audio', new Blob(chunks, { type: 'audio/webm' }), 'clip.webm');
      render((await api('/api/ivr/speech', fd, true)).turn);
      $('status').textContent = '';
    } catch (e) {
      $('status').textContent = t().err;
      say(t().err);
    } finally {
      $('status').classList.remove('thinking');
      $('talk').disabled = false;
    }
  };
  recorder.start();
  $('talk').classList.add('rec');
  $('talkLabel').textContent = t().stop;
  $('status').textContent = t().listening;
}

// Tap to start, tap to stop — hold-to-talk is fiddly on a cheap touchscreen and
// gives no second chance if the finger slips.
$('talk').onclick = async () => {
  if (recorder && recorder.state === 'recording') { recorder.stop(); recorder = null; return; }
  say(t().talk);
  try {
    await ensureCall();
    await startRec();
  } catch (e) {
    $('status').textContent = t().err;
  }
};

$('replay').onclick = () => { if (lastAudio) play(lastAudio); };

$('human').onclick = async () => {
  say(t().human);
  if (!callId) return;
  const r = await api('/api/ivr/digit', { call_id: callId, digit: '0' });
  $('answerText').textContent = r.turn.say;
  play(r.turn.audio_url);
};

for (const [id, code] of [['langHi','hi'], ['langEn','en']]) {
  $(id).onclick = () => {
    lang = code; callId = null;          // new language, new session
    applyLang();
    say(t().prompt);
  };
}

const setOnline = () => document.body.classList.toggle('offline', !navigator.onLine);
addEventListener('online', setOnline);
addEventListener('offline', setOnline);
setOnline();
applyLang();

if ('serviceWorker' in navigator) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {}));
}
</script>
</html>
